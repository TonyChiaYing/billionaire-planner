name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Domain tests (PlannerCore) via scripts/test.sh
        run: |
          set +e
          bash scripts/test.sh --core > core-test.log 2>&1
          code=$?
          grep -E "error:|failed|Executed .* tests|✅" core-test.log | tail -30
          exit $code

      - name: App integration tests (macOS)
        if: always()
        run: |
          set +e
          xcodebuild test -project BillionairePlanner.xcodeproj -scheme BillionairePlanner -destination 'platform=macOS' \
            -derivedDataPath out-test -only-testing:BillionairePlannerTests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= > app-test.log 2>&1
          code=$?
          grep -E "error:|failed|Executed|TEST (SUCCEEDED|FAILED)" app-test.log | tail -60
          exit $code

      - name: UI tests (macOS, accessibility)
        if: always()
        run: |
          set +e
          xcodebuild test -project BillionairePlanner.xcodeproj -scheme BillionairePlanner -destination 'platform=macOS' \
            -derivedDataPath out-test -only-testing:BillionairePlannerUITests \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= > ui-test.log 2>&1
          code=$?
          grep -E "error:|failed|passed|Executed|TEST (SUCCEEDED|FAILED)" ui-test.log | tail -60
          mkdir -p ui-diag; D=$(grep -oE "diag=[^ ]+" ui-test.log | head -1 | cut -d= -f2); [ -n "$D" ] && cp -R "$D"/. ui-diag/ 2>/dev/null
          ls ui-diag || true
          exit $code

      - name: Build macOS app (Release, universal)
        if: always()
        run: |
          set +e
          VER=$(cat VERSION)
          xcodebuild -version > build.log
          xcodebuild build -project BillionairePlanner.xcodeproj -scheme BillionairePlanner -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath out \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= >> build.log 2>&1
          code=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -60
          [ $code -eq 0 ] || exit $code
          APP=out/Build/Products/Release/BillionairePlanner.app
          lipo -info "$APP/Contents/MacOS/BillionairePlanner"
          ditto -c -k --keepParent "$APP" "BillionairePlanner_v$VER.app.zip"

      - name: Check iOS compiles
        if: always()
        run: |
          set +e
          xcodebuild build -project BillionairePlanner.xcodeproj -scheme BillionairePlanner -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath out-ios CODE_SIGNING_ALLOWED=NO > ios.log 2>&1 \
            && echo "iOS OK" >> ios.log || echo "iOS FAILED" >> ios.log
          grep -E "error:|iOS (OK|FAILED)" ios.log | head -40

      - name: Publish to build branch
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan build
          git rm -rf --cached . > /dev/null
          for f in core-test.log app-test.log ui-test.log build.log ios.log ui-diag BillionairePlanner_v*.app.zip; do [ -e "$f" ] && git add -f "$f"; done
          git commit -m "build $(cat VERSION) ${GITHUB_SHA::7}"
          git push -f origin build
